[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bidreader"
version = "0.1.0"
description = "Evidence-first tender document parsing and scoring-criteria review workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "httpx>=0.27,<1",
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
ocr = ["paddleocr>=3.0,<4", "pypdfium2>=4", "numpy>=1.26,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/bidreader/vendor/**"]

[tool.ruff.lint]
ignore = ["B008"]
